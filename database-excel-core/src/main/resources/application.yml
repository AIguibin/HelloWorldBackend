# ================================================
# application.yml 配置文件说明
# ================================================
# 此文件为 Spring Boot 应用程序的核心配置文件，用于定义模块的默认参数。
# 在 `database-excel-core` 模块中，主要配置该模块所需的基础信息，主模块同名配置会覆盖该模块配置。

# ----------------------------
# 配置项说明
# ----------------------------

# SVN 相关配置
app:
  svn:
    # SVN 仓库地址
    url: "svn://example.com/repo"

    # SVN 认证用户名
    username: "user"

    # SVN 认证密码
    password: "pass"