            background-color: #f5f7fa;

            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;

        }
        
        header {
            background: linear-gradient(135deg, #1a5f7a 0%, #2c3e50 100%);

            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .header-left p {
            color: #b0d7ff;
            font-size: 0.95rem;
        }
        
        .header-right {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #28a745;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #17a2b8;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #138496;
            transform: translateY(-2px);
        }
        
        .btn-add {
            background-color: #007bff;
            color: white;
        }
        
        .btn-add:hover {
            background-color: #0069d9;
            transform: translateY(-2px);
        }
        
        .controls {
            padding: 20px 30px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .filter-section {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-size: 0.85rem;
            color: #6c757d;
            font-weight: 600;
        }
        
        select, input {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background-color: white;
            border: 1px solid #ced4da;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .search-box input {
            border: none;
            flex-grow: 1;
            min-width: 200px;
        }
        
        .search-box i {
            padding: 0 12px;
            color: #6c757d;
        }
        
        .table-container {
            overflow-x: auto;
            padding: 0 5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1300px;
        }
        
        thead {
            background-color: #2c3e50;
            color: white;
        }
        
        th {
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            border-right: 1px solid #3a506b;
            position: sticky;
            top: 0;
        }
        
        th:last-child {
            border-right: none;
        }
        
        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.2s;
        }
        
        tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        td {
            padding: 12px;
            font-size: 0.9rem;
            vertical-align: top;
            border-right: 1px solid #e9ecef;
        }
        
        td:last-child {
            border-right: none;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            min-width: 70px;
        }
        
        .status-active {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-testing {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-disabled {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .protocol-tag {
            display: inline-block;
            padding: 3px 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 2px;
        }
        
        .env-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

            color: #721c24;
        }
        
        .env-uat {

        }
        
        .env-dev {
            background-color: #d4edda;
            color: #155724;

            border-radius: 4px;

                flex-direction: column;
                width: 100%;
                margin-top: 15px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1><i class="fas fa-network-wired"></i> 信贷系统外部链接网络管理清单</h1>

            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="downloadExcel">

                </button>
                <button class="btn btn-add" id="addRecord">

                </button>
            </div>
        </header>
        
        <div class="controls">
            <div class="filter-section">
                <div class="filter-group">
                    <label for="envFilter">环境筛选</label>
                    <select id="envFilter">
                        <option value="all">所有环境</option>
                        <option value="prod">生产环境</option>
                        <option value="uat">UAT测试</option>
                        <option value="sit">SIT测试</option>
                        <option value="dev">开发环境</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="statusFilter">状态筛选</label>
                    <select id="statusFilter">
                        <option value="all">所有状态</option>
                        <option value="active">启用中</option>
                        <option value="testing">测试中</option>
                        <option value="disabled">已停用</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="protocolFilter">协议筛选</label>
                    <select id="protocolFilter">
                        <option value="all">所有协议</option>
                        <option value="http">HTTP/HTTPS</option>
                        <option value="tcp">TCP</option>
                        <option value="sftp">SFTP</option>
                        <option value="mq">MQ</option>
                    </select>
                </div>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索链路名称、描述、IP地址...">
            </div>
        </div>
        
        <div class="table-container">
            <table id="networkTable">
                <thead>
                    <tr>
                        <th>链路编号</th>
                        <th>链路名称</th>
                        <th>源系统/环境</th>
                        <th>源IP地址</th>
                        <th>目标系统/环境</th>
                        <th>目标IP:端口</th>
                        <th>连接协议</th>
                        <th>认证方式</th>
                        <th>使用场景</th>
                        <th>负责人</th>
                        <th>链路状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 表格数据将通过JavaScript动态生成 -->
                </tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination">
            <!-- 分页按钮将通过JavaScript动态生成 -->
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #f8d7da;"></div>
                <span>生产环境</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #fff3cd;"></div>
                <span>UAT环境</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #d1ecf1;"></div>
                <span>SIT环境</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #d4edda;"></div>
                <span>开发环境</span>
            </div>
        </div>
        
        <footer>
            <p>© 2023 信贷系统网络管理清单 | 最后更新: <span id="currentDate"></span> | 共 <span id="totalRecords">0</span> 条记录</p>
            <p>注意：此清单应定期更新，确保网络链路信息的准确性和完整性</p>
        </footer>
    </div>

                description: "贷款审批通过、放款、结清等状态变更通过MQ通知相关系统",
                owner: "王十二",
                status: "active",
                lastUpdate: "2023-10-08",

            }

        // 当前显示的页码
        let currentPage = 1;
        const recordsPerPage = 8;
        
        // 初始化表格
        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            // 更新总记录数
            document.getElementById('totalRecords').textContent = data.length;
            
            // 计算分页
            const totalPages = Math.ceil(data.length / recordsPerPage);
            const startIndex = (currentPage - 1) * recordsPerPage;
            const endIndex = Math.min(startIndex + recordsPerPage, data.length);
            const pageData = data.slice(startIndex, endIndex);
            
            // 渲染当前页数据
            pageData.forEach(item => {
                const envClass = `env-${item.sourceEnv}`;
                const envName = getEnvName(item.sourceEnv);
                const statusClass = `status-${item.status}`;
                const statusText = getStatusText(item.status);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.id}</strong></td>
                    <td>${item.name}</td>
                    <td>
                        <div>${item.sourceSystem}</div>
                        <span class="env-badge ${envClass}">${envName}</span>
                    </td>
                    <td>${item.sourceIP}</td>
                    <td>
                        <div>${item.targetSystem}</div>
                        <span class="env-badge ${envClass}">${envName}</span>
                    </td>
                    <td>${item.targetIP}:${item.targetPort}</td>
                    <td><span class="protocol-tag">${item.protocol}</span></td>
                    <td>${item.authMethod}</td>
                    <td>${item.scenario}</td>
                    <td>${item.owner}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="action-buttons">
                            <div class="action-btn edit-btn" title="编辑">
                                <i class="fas fa-edit"></i>
                            </div>
                            <div class="action-btn delete-btn" title="删除">
                                <i class="fas fa-trash"></i>
                            </div>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
            
            // 渲染分页
            renderPagination(totalPages);
            
            // 为操作按钮添加事件监听
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    alert('编辑功能将在后续版本中实现');
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (confirm('确定要删除这条记录吗？')) {
                        alert('删除功能将在后续版本中实现');
                    }
                });
            });
        }
        
        // 渲染分页按钮
        function renderPagination(totalPages) {
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = '';
            
            // 上一页按钮
            const prevButton = document.createElement('button');
            prevButton.className = 'page-btn';
            prevButton.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevButton.disabled = currentPage === 1;
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    applyFilters();
                }
            });
            paginationDiv.appendChild(prevButton);
            
            // 页码按钮
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            // 调整起始页码
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageButton.textContent = i;
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    applyFilters();
                });
                paginationDiv.appendChild(pageButton);
            }
            
            // 下一页按钮
            const nextButton = document.createElement('button');
            nextButton.className = 'page-btn';
            nextButton.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextButton.disabled = currentPage === totalPages;
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    applyFilters();
                }
            });
            paginationDiv.appendChild(nextButton);
        }
        
        // 获取环境显示名称
        function getEnvName(envCode) {
            const envMap = {
                'prod': '生产',
                'uat': 'UAT',
                'sit': 'SIT',
                'dev': '开发'
            };
            return envMap[envCode] || envCode;
        }
        
        // 获取状态显示文本
        function getStatusText(statusCode) {
            const statusMap = {
                'active': '启用中',
                'testing': '测试中',
                'disabled': '已停用'
            };
            return statusMap[statusCode] || statusCode;
        }
        
        // 应用筛选
        function applyFilters() {
            const envFilter = document.getElementById('envFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const protocolFilter = document.getElementById('protocolFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredData = networkData;
            
            // 环境筛选
            if (envFilter !== 'all') {
                filteredData = filteredData.filter(item => item.sourceEnv === envFilter);
            }
            
            // 状态筛选
            if (statusFilter !== 'all') {
                filteredData = filteredData.filter(item => item.status === statusFilter);
            }
            
            // 协议筛选
            if (protocolFilter !== 'all') {
                filteredData = filteredData.filter(item => {
                    const protocol = item.protocol.toLowerCase();
                    if (protocolFilter === 'http') {
                        return protocol.includes('http');
                    } else if (protocolFilter === 'tcp') {
                        return protocol.includes('tcp');
                    } else if (protocolFilter === 'sftp') {
                        return protocol.includes('sftp');
                    } else if (protocolFilter === 'mq') {
                        return protocol.includes('mq');
                    }
                    return true;
                });
            }
            
            // 搜索筛选
            if (searchText) {
                filteredData = filteredData.filter(item => 
                    item.name.toLowerCase().includes(searchText) ||
                    item.id.toLowerCase().includes(searchText) ||
                    item.sourceIP.toLowerCase().includes(searchText) ||
                    item.targetIP.toLowerCase().includes(searchText) ||
                    item.scenario.toLowerCase().includes(searchText) ||
                    item.description.toLowerCase().includes(searchText)
                );
            }
            
            // 重置到第一页
            currentPage = 1;
            
            // 渲染筛选后的数据
            renderTable(filteredData);
        }
        
        // 下载Excel文件
        function downloadExcel() {
            // 准备完整数据（包含所有字段）
            const excelData = networkData.map(item => ({
                '链路编号': item.id,
                '链路名称': item.name,
                '源系统': item.sourceSystem,
                '源环境': getEnvName(item.sourceEnv),
                '源IP地址': item.sourceIP,
                '目标系统': item.targetSystem,
                '目标环境': getEnvName(item.targetEnv),
                '目标IP地址': item.targetIP,
                '目标端口': item.targetPort,
                '连接协议': item.protocol,
                '认证方式': item.authMethod,
                '使用场景': item.scenario,
                '链路描述': item.description,
                '负责人': item.owner,
                '链路状态': getStatusText(item.status),
                '最近更新日期': item.lastUpdate,
                '监控等级': item.monitoringLevel
            }));
            
            // 创建工作表
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            
            // 创建工作簿
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "网络链路清单");
            
            // 设置列宽
            const wscols = [
                {wch: 15}, // 链路编号
                {wch: 30}, // 链路名称
                {wch: 20}, // 源系统
                {wch: 10}, // 源环境
                {wch: 15}, // 源IP地址
                {wch: 20}, // 目标系统
                {wch: 10}, // 目标环境
                {wch: 20}, // 目标IP地址
                {wch: 10}, // 目标端口
                {wch: 10}, // 连接协议
                {wch: 25}, // 认证方式
                {wch: 30}, // 使用场景
                {wch: 40}, // 链路描述
                {wch: 10}, // 负责人
                {wch: 10}, // 链路状态
                {wch: 15}, // 最近更新日期
                {wch: 12}  // 监控等级
            ];
            worksheet['!cols'] = wscols;
            
            // 生成Excel文件并下载
            const fileName = `信贷系统外部链接网络管理清单_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
            
            // 显示下载成功消息
            alert(`Excel文件 "${fileName}" 已开始下载！`);
        }
        
        // 打印表格
        function printTable() {
            // 创建一个包含完整数据的打印视图
            let printContent = `
                <html>
                <head>
                    <title>信贷系统外部链接网络管理清单</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 20px; }
                        h1 { color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 12px; }
                        th { background-color: #2c3e50; color: white; }
                        tr:nth-child(even) { background-color: #f9f9f9; }
                        .footer { margin-top: 30px; font-size: 12px; color: #666; }
                    </style>
                </head>
                <body>
                    <h1>信贷系统外部链接网络管理清单</h1>
                    <p>打印时间: ${new Date().toLocaleString('zh-CN')}</p>
                    <table>
                        <thead>
                            <tr>
                                <th>链路编号</th>
                                <th>链路名称</th>
                                <th>源系统/环境</th>
                                <th>源IP地址</th>
                                <th>目标系统/环境</th>
                                <th>目标IP:端口</th>
                                <th>连接协议</th>
                                <th>认证方式</th>
                                <th>使用场景</th>
                                <th>负责人</th>
                                <th>链路状态</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            networkData.forEach(item => {
                const envName = getEnvName(item.sourceEnv);
                const statusText = getStatusText(item.status);
                
                printContent += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.sourceSystem} (${envName})</td>
                        <td>${item.sourceIP}</td>
                        <td>${item.targetSystem} (${envName})</td>
                        <td>${item.targetIP}:${item.targetPort}</td>
                        <td>${item.protocol}</td>
                        <td>${item.authMethod}</td>
                        <td>${item.scenario}</td>
                        <td>${item.owner}</td>
                        <td>${statusText}</td>
                    </tr>
                `;
            });
            
            printContent += `
                        </tbody>
                    </table>
                    <div class="footer">
                        <p>© 2023 信贷系统网络管理清单 | 共 ${networkData.length} 条记录</p>
                    </div>
                </body>
                </html>
            `;
            
            // 打开打印窗口
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent);
            printWindow.document.close();
            printWindow.focus();
            
            // 延迟打印以确保内容加载完成
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 500);
        }
        
        // 添加新记录
        function addNewRecord() {
            alert('添加新记录功能将在后续版本中实现。\n\n当前版本建议：\n1. 在Excel文件中添加新记录\n2. 使用"下载完整Excel表格"功能获取模板\n3. 填写后通过其他方式导入数据');
        }
        
        // 初始化事件监听器
        document.getElementById('downloadExcel').addEventListener('click', downloadExcel);
        document.getElementById('printTable').addEventListener('click', printTable);
        document.getElementById('addRecord').addEventListener('click', addNewRecord);
        document.getElementById('envFilter').addEventListener('change', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);
        document.getElementById('protocolFilter').addEventListener('change', applyFilters);
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        
        // 初始渲染表格
        renderTable(networkData);
    </script>
</body>
</html>
