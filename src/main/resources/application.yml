server:
  port: 8080

spring:
  application:
    name: aiguibin-platform-arch
  # 默认激活 dev；生产部署用 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 数据库迁移：骨架保持无数据库可启动；业务项目接入数据库后置为 true，
  # 迁移脚本位于 classpath:db/migration（V1__xxx.sql 递增）
  flyway:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delInd
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

logging:
  level:
    root: INFO
    '[com.aiguibin.platform.arch]': INFO
