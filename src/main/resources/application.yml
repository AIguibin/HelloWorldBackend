server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aiguibin_arch_tables?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: P@ssW0rd
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 最大连接数
      maximum-pool-size: 20
      # 最小空闲连接数
      minimum-idle: 5
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒）
      idle-timeout: 600000
      # 连接最大生命周期（毫秒）
      max-lifetime: 1800000
      # 连接验证超时时间（毫秒）
      validation-timeout: 5000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 连接池名称
      pool-name: OnlineTableHikariCP
      # 是否自动提交
      auto-commit: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never


mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

logging:
  level:
    root: INFO
    '[com.aiguibin.platform.arch]': INFO
    '[com.aiguibin.platform.arch.mapper]': DEBUG
